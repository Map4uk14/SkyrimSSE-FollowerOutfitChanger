<!DOCTYPE html>

  Icons: game-icons.net, licensed CC BY 3.0 (https://creativecommons.org/licenses/by/3.0/).
  Authors used here: Lorc, Delapouite, Sbed, Lucas, Carl Olsen. Inlined as single-path

<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dress Your Followers</title>
<style>
  * {
    -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    font-family: "Segoe UI", sans-serif; box-sizing: border-box;
  }
  /* The filter box must stay editable/selectable. */
  #filter { -webkit-user-select: text; user-select: text; }
  html, body { margin: 0; padding: 0; background: transparent; }

  #panel {
    position: fixed; top: 12%; left: 40px;
    width: 440px; max-height: 84vh;
    display: flex; flex-direction: column;
    background: rgba(20, 22, 28, 0.92);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.55);
    color: #e8e8ea;
    overflow: hidden;
  }
  #header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; background: rgba(255,255,255,0.04);
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  #title { font-size: 15px; font-weight: 600; }
  #subtitle { font-size: 12px; color: #9aa0aa; margin-top: 2px; }
  #btns { display: flex; align-items: center; gap: 4px; }
  .hbtn {
    cursor: pointer; height: 26px; min-width: 26px; padding: 0 8px;
    line-height: 24px; text-align: center; border-radius: 6px;
    color: #cfd2d8; font-size: 13px; white-space: nowrap;
  }
  .hbtn:hover { background: rgba(255,255,255,0.12); color: #fff; }
  #change { font-size: 12px; }
  #close { font-size: 16px; }

  #list, #picker { overflow-y: auto; padding: 6px 6px 10px; }
  .row, .frow {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 7px; cursor: pointer;
  }
  .row:hover, .frow:hover { background: rgba(255,255,255,0.06); }
  .row .box {
    width: 18px; height: 18px; flex: 0 0 18px; border-radius: 4px;
    border: 1.5px solid #6b7280; display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: #0b0d12;
  }
  .row.on .box { background: #6ee7a8; border-color: #6ee7a8; }
  .row .label, .frow .label { font-size: 13px; flex: 1; }
  .row.on .label { color: #ffffff; }
  .slot-icon { width: 20px; height: 20px; flex: 0 0 auto; color: #b7bdc9; }
  .row.on .slot-icon { color: #6ee7a8; }
  svg.gi { width: 100%; height: 100%; display: block; fill: currentColor; }
  .frow .chev { color: #6b7280; font-size: 14px; }
  #empty { padding: 18px 14px; color: #9aa0aa; font-size: 13px; }

  #filterbar { padding: 8px 12px 4px; }
  #filter {
    width: 100%; box-sizing: border-box;
    background: rgba(0,0,0,0.30); color: #e8e8ea;
    border: 1px solid rgba(255,255,255,0.12); border-radius: 7px;
    padding: 7px 10px; font-size: 13px; outline: none;
  }
  #filter::placeholder { color: #7c8290; }
  #filter:focus { border-color: rgba(110,231,168,0.55); }

  #details {
    border-top: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.035);
    padding: 12px 14px 14px; font-size: 12px; color: #c4c8d0;
  }
  #details.hint { color: #9aa0aa; font-style: italic; padding: 16px 14px; }
  .d-head { display: flex; align-items: center; gap: 11px; margin-bottom: 11px; }
  .d-icon { width: 30px; height: 30px; flex: 0 0 auto; color: #dfe3ea; }
  .d-titles { min-width: 0; flex: 1; }
  .d-name { font-size: 14px; font-weight: 600; color: #ffffff; }
  .d-sub { font-size: 11px; color: #9aa0aa; margin-top: 2px; }
  .d-chips { display: flex; gap: 8px; }
  .chip {
    flex: 1; background: rgba(255,255,255,0.05); border-radius: 8px;
    padding: 8px 4px; text-align: center;
  }
  .chip-v { font-size: 16px; font-weight: 600; color: #e8e8ea; }
  .chip-l { font-size: 9px; letter-spacing: .6px; color: #838a9a; margin-top: 3px; }
  .d-ench {
    margin-top: 11px; padding: 8px 11px; border-radius: 8px;
    background: rgba(120,140,255,0.12); color: #bcc8ff; font-size: 12px;
  }
</style>
</head>
<body>
<div id="panel">
  <div id="header">
    <div>
      <div id="title">Dresser</div>
      <div id="subtitle">Choose a follower</div>
    </div>
    <div id="btns">
      <div id="change" class="hbtn" style="display:none" onclick="window.dyf_showpicker('')">&#8646; Change</div>
      <div id="close" class="hbtn" onclick="window.dyf_close('')">&#10005;</div>
    </div>
  </div>
  <div id="filterbar" style="display:none"><input id="filter" type="text" placeholder="Filter items…"></div>
  <div id="picker"></div>
  <div id="list" style="display:none"></div>
  <div id="details" class="hint" style="display:none">Hover an item for details</div>
</div>

<script>
  // Two views share the panel:
  //  - #picker : the "choose a nearby follower" list (window.dyfFollowers)
  //  - #list   : that follower's wardrobe of checkboxes (window.dyfRender)
  // The plugin decides which to show: F4 on a follower opens their wardrobe
  // directly; otherwise the picker. The "Change" button returns to the picker.

  var rowsById = {};   // wardrobe: id -> { setWorn(bool), worn, slot }
  var currentSig = ""; // signature of the current item set (to detect changes)

  // Diagnostic: send a line to the SKSE log via the dyf_log C++ listener.
  function dlog(msg) { try { if (window.dyf_log) window.dyf_log(String(msg)); } catch (e) {} }
  window.onerror = function (msg, src, line, col, err) {
    dlog("onerror: " + msg + " @" + line + ":" + col + (err && err.stack ? " " + err.stack : ""));
  };

  // Belt-and-suspenders: suppress the browser's text selection (double-click word
  // select, click-drag highlight) everywhere except the filter box. CSS user-select
  // covers most of it; Ultralight still fires selectstart on double-click.
  document.addEventListener("selectstart", function (e) {
    if (e.target && e.target.id === "filter") { return; }
    e.preventDefault();
  });

  // C++ sends the payload base64-encoded (see Base64Encode in Dresser.cpp) so the
  // Invoke("dyfRender(\"...\")") snippet is always valid JS. Decode -> UTF-8 JSON
  // -> object. Falls back to a plain object/JSON string if it is ever called that
  // way, so the receivers stay robust.
  function dyfDecode(payload) {
    if (typeof payload !== "string") { return payload; } // already an object
    var bin = atob(payload); // base64 -> binary (Latin1) string, one char per byte
    try {
      // Proper UTF-8 decode; throws if a byte sequence is not valid UTF-8 (e.g. a
      // mod item name stored in Windows-1252).
      return JSON.parse(decodeURIComponent(escape(bin)));
    } catch (e) {
      // Fall back to the raw decoded bytes so the wardrobe still loads (the
      // offending name may show mojibake, but everything else is fine). NOTE: this
      // must parse `bin`, NOT `payload` - `payload` is still base64.
      return JSON.parse(bin);
    }
  }

  function show(which) {
    document.querySelector("#picker").style.display    = which === "picker" ? "" : "none";
    document.querySelector("#list").style.display      = which === "list"   ? "" : "none";
    document.querySelector("#change").style.display    = which === "list"   ? "" : "none";
    document.querySelector("#details").style.display   = which === "list"   ? "" : "none";
    document.querySelector("#filterbar").style.display = which === "list"   ? "" : "none";
  }

  // ---- Filter --------------------------------------------------------------

  var filterText = "";
  document.querySelector("#filter").addEventListener("input", function (e) {
    filterText = (e.target.value || "").toLowerCase();
    applyFilter();
  });
  function applyFilter() {
    Object.keys(rowsById).forEach(function (id) {
      var r = rowsById[id];
      var match = !filterText || r.name.indexOf(filterText) !== -1;
      r.el.style.display = match ? "" : "none";
    });
  }

  // ---- Follower picker -----------------------------------------------------

  window.dyfFollowers = function (payload) {
    var data;
    try { data = dyfDecode(payload); } catch (e) { return; }

    currentSig = ""; // force a wardrobe rebuild next time one is shown
    document.querySelector("#subtitle").textContent = "Choose a follower";

    var picker = document.querySelector("#picker");
    picker.innerHTML = "";
    show("picker");

    var followers = data.followers || [];
    if (!followers.length) {
      var empty = document.createElement("div");
      empty.id = "empty";
      empty.textContent = "No followers nearby. ";
      // Follower frameworks re-register followers a moment after a save loads,
      // so an empty list may just be early - offer a one-click rescan.
      var again = document.createElement("span");
      again.textContent = "↻ Rescan";
      again.style.cssText = "color:#6ee7a8;cursor:pointer;";
      again.onclick = function () { window.dyf_showpicker(""); };
      empty.appendChild(again);
      picker.appendChild(empty);
      return;
    }

    followers.forEach(function (f) {
      var row = document.createElement("div");
      row.className = "frow";
      var label = document.createElement("div");
      label.className = "label";
      label.textContent = f.name;
      var chev = document.createElement("div");
      chev.className = "chev";
      chev.innerHTML = "&#8250;"; // ›
      row.appendChild(label);
      row.appendChild(chev);
      row.onclick = function () { window.dyf_pick(f.id); };
      picker.appendChild(row);
    });
  };

    crossbow: "M89.594 18.094l-10.75 10.75.03.03 27.532 333.563-83.03 92.938 33.25 33.25 90.155-80.563 336.19 24.907c.06.062.124.124.186.186l.156-.156h.032v-.03l10.562-10.564c-1.676-1.676-3.122-3.437-4.687-5.156-21.332-25.55-25.416-63.24-35.47-109.125-8.323-37.99-21.225-81.042-53.094-125.03l-38.062 50.81c.005.008-.005.026 0 .032 28.988 36.074 46.027 67.766 59.72 96.25 15.017 31.247 26.122 59 44.467 83.688L165.314 391.5 337.53 237.594l64.376-85.97-41.53-41.53-85.907 64.312L122.81 344.094 98.156 45.25c24.68 18.33 52.425 29.426 83.656 44.438 28.49 13.693 60.2 30.72 96.282 59.718l50.812-38.062c-43.99-31.86-87.04-44.736-125.03-53.063C157.987 48.224 120.3 44.113 94.75 22.78c-1.72-1.564-3.48-3.01-5.156-4.686zm317.03.312c-3.385.028-6.862.406-10.28.97-4.558.75-8.992 1.837-12.813 3.093-3.82 1.254-6.776 2.302-9.717 4.624a7.184 7.184 0 0 0-2.72 6.187l5.032 62.345a7.184 7.184 0 0 0 2.063 4.53l33.656 33.626a7.184 7.184 0 0 0 4.5 2.095l62.344 5.03a7.184 7.184 0 0 0 6.218-2.718c2.335-2.944 3.367-5.895 4.625-9.718 1.26-3.824 2.343-8.255 3.095-12.814.752-4.56 1.18-9.198.875-13.625-.305-4.425-1.012-8.99-4.844-12.81L422.78 23.343c-3.822-3.824-8.384-4.54-12.81-4.844-1.108-.076-2.216-.103-3.345-.094zm.126 14.375c.8-.006 1.563.016 2.25.064 2.404.165 3.74.915 3.72.78l65.655 65.657c-.138-.023.616 1.318.78 3.72.19 2.746-.062 6.526-.686 10.313-.626 3.786-1.595 7.62-2.595 10.656-.412 1.25-.524 1.272-.938 2.186l-54.78-4.375-29.938-29.936-4.376-54.813c.913-.41.94-.495 2.187-.905 3.037-.998 6.872-1.97 10.658-2.594 2.84-.466 5.662-.728 8.062-.75zm-47.97 120.44l-18.936 31.593-204.5 204.468-8.844-.655-1.188-14.563 201.875-201.906 31.594-18.937z",
  };
  function svgIcon(key) {
    var d = ICON_PATHS[key] || ICON_PATHS.other;
    return '<svg class="gi" viewBox="0 0 512 512"><path d="' + d + '"/></svg>';
  }

  // Map an armor's biped-slot bitmask to an icon key. Checked in priority order so
  // a multi-slot piece (e.g. body+hands+feet) shows its most defining slot.
  function slotKey(mask) {
    mask = mask || 0;
    var checks = [
      [0x1,     "helm"],     // head
      [0x1000,  "crown"],    // circlet
      [0x4,     "body"],     // body
      [0x10000, "body"],     // modded chest -> body
      [0x8,     "hands"],    // hands
      [0x10,    "hands"],    // forearms
      [0x80,    "feet"],     // feet
      [0x100,   "feet"],     // calves
      [0x20,    "amulet"],   // amulet
      [0x40,    "ring"],     // ring
      [0x200,   "shield"],   // shield
      [0x20000, "cloak"],    // modded back -> cloak
      [0x400,   "other"],    // tail (no dedicated icon)
      [0x2,     "hair"]      // hair
    ];
    for (var i = 0; i < checks.length; i++) {
      if ((mask & checks[i][0]) !== 0) { return checks[i][1]; }
    }
    return "other"; // other / modded slot
  }

  // Readable slot name for the details line (primary slot, same priority as icon).
  function slotName(mask) {
    mask = mask || 0;
    var checks = [
      [0x1, "Head"], [0x1000, "Circlet"], [0x4, "Body"], [0x10000, "Body"],
      [0x8, "Hands"], [0x10, "Hands"], [0x80, "Feet"], [0x100, "Feet"],
      [0x20, "Amulet"], [0x40, "Ring"], [0x200, "Shield"], [0x20000, "Cloak"],
      [0x400, "Tail"], [0x2, "Hair"]
    ];
    for (var i = 0; i < checks.length; i++) {
      if ((mask & checks[i][0]) !== 0) { return checks[i][1]; }
    }
    return "Other";
  }

  // Weapon type (0-9) -> icon key and readable name.
  var WEAPON_KEYS = ["fist", "sword", "dagger", "waraxe", "mace",
                     "greatsword", "battleaxe", "bow", "staff", "crossbow"];
  var WEAPON_NAMES = ["Unarmed", "Sword", "Dagger", "War Axe", "Mace",
                      "Greatsword", "Battleaxe", "Bow", "Staff", "Crossbow"];
  function weaponKey(t) { return WEAPON_KEYS[t] || "sword"; }
  function weaponName(t) { return WEAPON_NAMES[t] || "Weapon"; }

  // The icon key for an item (armor slot or weapon type).
  function itemIconKey(item) {
    return item.kind === 1 ? weaponKey(item.wtype) : slotKey(item.slot);
  }
  // Ready-to-inject SVG markup for a row / the details header.
  function itemIcon(item) { return svgIcon(itemIconKey(item)); }

  // Type + slot/kind subtitle. Clothing on a ring/amulet slot reads as Jewelry.
  function subtitle(item) {
    if (item.kind === 1) {
      return weaponName(item.wtype) + "   ·   Weapon";
    }
    var t = ["Light Armor", "Heavy Armor", "Clothing"][item.atype] || "";
    var s = slotName(item.slot);
    if (item.atype === 2 && (s === "Ring" || s === "Amulet")) { t = "Jewelry"; }
    return t ? (t + "   ·   " + s) : s;
  }

  function chip(value, label) {
    var c = document.createElement("div");
    c.className = "chip";
    var v = document.createElement("div");
    v.className = "chip-v";
    v.textContent = value;
    var l = document.createElement("div");
    l.className = "chip-l";
    l.textContent = label;
    c.appendChild(v);
    c.appendChild(l);
    return c;
  }

  // Fill the footer with the hovered item's stats. Built from DOM nodes (not
  // innerHTML) so item names can't inject markup.
  function setDetails(item) {
    var d = document.querySelector("#details");
    d.className = "";
    d.innerHTML = "";

    var head = document.createElement("div");
    head.className = "d-head";
    var ic = document.createElement("div");
    ic.className = "d-icon";
    ic.innerHTML = itemIcon(item);
    var titles = document.createElement("div");
    titles.className = "d-titles";
    var name = document.createElement("div");
    name.className = "d-name";
    name.textContent = item.name;
    var sub = document.createElement("div");
    sub.className = "d-sub";
    sub.textContent = subtitle(item);
    titles.appendChild(name);
    titles.appendChild(sub);
    head.appendChild(ic);
    head.appendChild(titles);
    d.appendChild(head);

    var chips = document.createElement("div");
    chips.className = "d-chips";
    if (item.kind === 1) {
      chips.appendChild(chip(item.damage || 0, "DAMAGE"));
    } else if (item.armor > 0) {
      chips.appendChild(chip(item.armor, "ARMOR"));
    }
    chips.appendChild(chip((Number(item.weight) || 0).toFixed(1), "WEIGHT"));
    chips.appendChild(chip(item.value || 0, "VALUE"));
    d.appendChild(chips);

    if (item.ench) {
      var ench = document.createElement("div");
      ench.className = "d-ench";
      ench.textContent = "✦ " + item.ench;
      d.appendChild(ench);
    }
  }

  function detailsHint() {
    var d = document.querySelector("#details");
    d.className = "hint";
    d.textContent = "Hover an item for details";
  }

  function makeRow(item) {
    var row = document.createElement("div");
    var box = document.createElement("div");
    box.className = "box";
    var label = document.createElement("div");
    label.className = "label";
    label.textContent = item.name;
    var icon = document.createElement("div");
    icon.className = "slot-icon";
    icon.innerHTML = itemIcon(item);

    row.appendChild(box);
    row.appendChild(label);
    row.appendChild(icon);

    row.onmouseenter = function () { setDetails(item); };

    var entry = {
      worn: null,
      slot: item.slot || 0,
      name: (item.name || "").toLowerCase(),
      el: row,
      setWorn: function (on) {
        if (entry.worn === on) return;
        entry.worn = on;
        row.className = "row" + (on ? " on" : "");
        box.innerHTML = on ? "&#10003;" : "";
      }
    };
    entry.setWorn(!!item.worn);

    row.onclick = function () {
      var nowOn = !entry.worn;
      entry.setWorn(nowOn);
      // Optimistic same-slot clear: two pieces can't share a biped slot, so when
      // this one goes on, visually take off any other item that overlaps its slot.
      if (nowOn && entry.slot) {
        Object.keys(rowsById).forEach(function (oid) {
          if (oid !== item.id) {
            var o = rowsById[oid];
            if (o.worn && (o.slot & entry.slot) !== 0) { o.setWorn(false); }
          }
        });
      }
      window.dyf_toggle(item.id + "|" + (nowOn ? "1" : "0"));
    };

    return { el: row, entry: entry };
  }

  window.dyfRender = function (payload) {
    var data;
    try { data = dyfDecode(payload); }
    catch (e) { dlog("dyfRender decode ERR: " + e); return; }
    try { render_body(data); }
    catch (e) { dlog("dyfRender body ERR: " + e + (e && e.stack ? " " + e.stack : "")); }
  };

  function render_body(data) {
    document.querySelector("#subtitle").textContent =
      data.name ? ("Dressing: " + data.name) : "Look at a follower";
    show("list");

    // Fixed alphabetical order so a row never moves when its worn state changes.
    var items = (data.items || []).slice().sort(function (a, b) {
      return a.name.localeCompare(b.name);
    });
    var sig = items.map(function (it) { return it.id; }).join(",");
    var list = document.querySelector("#list");

    // Same item set as last push -> just reconcile worn state in place.
    if (sig !== "" && sig === currentSig) {
      items.forEach(function (it) {
        var r = rowsById[it.id];
        if (r) { r.setWorn(!!it.worn); }
      });
      return;
    }

    // Item set changed (or first paint) -> rebuild the list.
    currentSig = sig;
    rowsById = {};
    list.innerHTML = "";
    detailsHint();

    if (!items.length) {
      var empty = document.createElement("div");
      empty.id = "empty";
      empty.textContent = "No wearable items.";
      list.appendChild(empty);
      return;
    }

    items.forEach(function (it) {
      var made = makeRow(it);
      rowsById[it.id] = made.entry;
      list.appendChild(made.el);
    });
    applyFilter(); // keep any active filter after a rebuild
  };
</script>
